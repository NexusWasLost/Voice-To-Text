<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice To Text</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>

    <div class="app-container">
        <header>
            <div class="brand">Voice.To.Text</div>
            <a href="https://github.com/NexusWasLost/Voice-To-Text" target="_blank" class="gh-link">
                <i class="fa-brands fa-github fa-lg"></i>
            </a>
        </header>

        <div class="btn-container">
            <button class="talk-btn button">
                <i class="fa-solid fa-microphone-slash"></i>
            </button>
        </div>

        <div class="content-wrapper">
            <div class="transcription-header">
                <span style="font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px;">ENGINE ACTIVE //
                    READY</span>
                <button id="copy-btn">
                    <i class="fa-solid fa-copy"></i> Copy Text
                </button>
            </div>

            <div class="transcription-area">
            </div>
        </div>
    </div>

    <script type="module" src="./JS/main.js" defer></script>
</body>

</html>
